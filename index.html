<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý bán hàng</title>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#1769aa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--blue:#1769aa;--blue2:#0e5795;--bg:#f3f6fa;--ink:#1e293b;--muted:#64748b;--line:#e5eaf0;--green:#15966a;--red:#d94848}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:#fff;font-weight:600}button:hover{background:var(--blue2)}button.secondary{background:#edf4fb;color:var(--blue)}button.ghost{background:#fff;color:#334155;border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 22px;font-size:18px;font-weight:800;color:var(--blue)}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#31b8da,#1769aa);display:grid;place-items:center;color:white}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#526174;text-align:left;font-weight:600;padding:11px 12px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:#eaf4fc;color:var(--blue)}.nav .ico{width:20px;text-align:center}.sidefoot{position:absolute;bottom:18px;left:20px;color:var(--muted);font-size:12px}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}.topbar strong{font-size:16px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#dceefa;color:var(--blue);display:grid;place-items:center;font-weight:800}.content{padding:24px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.heading h1{margin:0;font-size:24px}.sub{color:var(--muted);margin-top:4px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:25px;font-weight:800;margin:7px 0}.trend{font-size:12px;color:var(--green)}.panel{margin-bottom:18px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-title h3{margin:0;font-size:16px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select,.field input,.field select{border:1px solid #d9e1ea;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);min-width:0}.tools input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:700;background:#fbfcfe}td strong{font-weight:700}.pill{padding:4px 8px;border-radius:20px;font-size:12px;background:#eaf8f1;color:#13835c}.pill.low{background:#fff3dc;color:#a66a00}.pill.cancel{background:#fff0f0;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:35px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:16px;text-align:left;background:#f3f8fc;color:var(--blue);border:1px solid #dfedf8}.quick span{display:block;font-size:22px;margin-bottom:6px}.barrow{display:grid;grid-template-columns:95px 1fr 80px;gap:10px;align-items:center;margin:13px 0}.bar{height:9px;background:#edf2f7;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#28a3d4;border-radius:20px}.muted{color:var(--muted)}.modalback{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:white;border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0f172a33}.modal h2{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#526174}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:20px;right:20px;background:#172b40;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:30}.mobile-menu{display:none}.receipt{font-family:monospace;border:1px dashed #cbd5e1;padding:15px;margin-top:12px}.hidden{display:none!important}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-245px;z-index:15;width:230px;transition:left .2s;box-shadow:0 10px 30px #0001}.sidebar.open{left:0}.mobile-menu{display:inline-block}.topbar{padding:0 15px}.content{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.sidefoot{position:static;margin:25px 10px 0}}@media(max-width:500px){.cards{gap:8px}.stat{padding:13px}.stat .value{font-size:20px}.heading h1{font-size:21px}.topbar strong{font-size:14px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.hide-small{display:none}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">K</div><span>Quản lý bán hàng</span></div>
<nav class="nav" id="nav">
<button class="active" data-page="home"><span class="ico">▦</span>Tổng quan</button>
<button data-page="sales"><span class="ico">🧾</span>Bán hàng / Hóa đơn</button>
<button data-page="products"><span class="ico">📦</span>Sản phẩm</button>

<button data-page="customers"><span class="ico">👥</span>Khách hàng</button>
<button data-page="employees"><span class="ico">🧑‍💼</span>Nhân viên</button>
<button data-page="reports"><span class="ico">📊</span>Báo cáo</button>
<button data-page="settings"><span class="ico">⚙️</span>Cài đặt</button>
</nav><div class="sidefoot">Ứng dụng quản lý bán hàng</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" onclick="toggleMenu()">☰</button><strong id="topTitle">Tổng quan</strong></div><div class="top-actions"><button class="secondary" id="installBtn" style="display:none" onclick="installApp()">＋ Cài app</button><button class="secondary" onclick="openCloudSetup()">☁ Đồng bộ</button><span class="muted hide-small">Cửa hàng của tôi</span><div class="avatar">CH</div></div></header>
<div class="content" id="view"></div></main></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div id="modalbody"></div></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const money=n=>Number(n||0).toLocaleString('vi-VN')+' ₫';
const seedProducts=[
{id:2001,sku:'SP001',name:'Ớt Hành',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2002,sku:'SP002',name:'Ớt Xanh',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2003,sku:'SP003',name:'Dầu Tỏi',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2004,sku:'SP004',name:'Mật Ong',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2005,sku:'SP005',name:'Sốt Tắc',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2006,sku:'SP006',name:'Tắc Hành Đại',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2007,sku:'SP007',name:'Dầu Tỏi Đại',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2008,sku:'SP008',name:'Ớt Tỏi',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2009,sku:'SP009',name:'Khô Bò',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2010,sku:'SP010',name:'Sate Me Bơ',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2011,sku:'SP011',name:'Sặc Hành',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2012,sku:'SP012',name:'Sặc Ruốc',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2013,sku:'SP013',name:'Tóp Mỡ',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2014,sku:'SP014',name:'Tóp Mỡ Khô Bò',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2015,sku:'SP015',name:'Muối Béo',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2016,sku:'SP016',name:'Sate Sợi',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2017,sku:'SP017',name:'Đặc Biệt',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2018,sku:'SP018',name:'Bơ trung',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2019,sku:'SP019',name:'Bơ nhỏ',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2020,sku:'SP020',name:'Tắc ly',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2021,sku:'SP021',name:'Me ly',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2022,sku:'SP022',name:'Me bơ',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2023,sku:'SP023',name:'Mỡ Hành',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2024,sku:'SP8E4D0B',name:'M.Sặc',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2025,sku:'SP60732B',name:'Bơ đại',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2026,sku:'SP85748E',name:'Dầu Tỏi 7',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2027,sku:'SPE719B6',name:'Dầu Ớt',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2028,sku:'SP7BC0EC',name:'Sợi long',unit:'bịch',price:0,cost:0,category:'Khác'},
{id:2029,sku:'SPD48776',name:'Sate Hành',unit:'bịch',price:0,cost:0,category:'Khác'}
];
function loadStore(key,legacy,fallback){let v=localStorage.getItem(key);if(v===null){v=localStorage.getItem(legacy);if(v!==null)localStorage.setItem(key,v)}try{return v===null?fallback:JSON.parse(v)}catch{return fallback}}
let products=loadStore('shop_products','shop_products',null);if(!Array.isArray(products)||products.length===0){products=seedProducts.map(p=>({...p}));localStorage.setItem('shop_products',JSON.stringify(products))}
let customers=loadStore('shop_customers','shop_customers',[{id:1,name:'Khách lẻ',phone:'',points:0}]);
let orders=loadStore('shop_orders','shop_orders',[]);
let page='home', searchTerm='';
let cloudReady=false, cloudApplying=false, cloudUnsubscribe=null, cloudWriteTimer=null;
function save(){localStorage.setItem('shop_products',JSON.stringify(products));localStorage.setItem('shop_customers',JSON.stringify(customers));localStorage.setItem('shop_orders',JSON.stringify(orders));syncSheetsBackground();syncFirestoreBackground()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
const titles={home:'Tổng quan',sales:'Bán hàng / Hóa đơn',products:'Sản phẩm',customers:'Khách hàng',employees:'Quản lý nhân viên',reports:'Báo cáo',settings:'Cài đặt'};
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('topTitle').textContent=titles[page];document.getElementById('sidebar').classList.remove('open');render()});
function render(){let v=document.getElementById('view');if(page==='home')v.innerHTML=homePage();if(page==='products')v.innerHTML=productsPage();if(page==='customers')v.innerHTML=customersPage();if(page==='employees')v.innerHTML=employeesPage();if(page==='sales')v.innerHTML=salesPage();if(page==='reports')v.innerHTML=reportsPage();if(page==='settings')v.innerHTML=settingsPage()}
function homePage(){let revenue=orders.filter(o=>o.status!=='Đã hủy').reduce((a,o)=>a+o.total,0),today=new Date().toLocaleDateString('vi-VN');let todayOrders=orders.filter(o=>o.date===today&&o.status!=='Đã hủy');return `<div class="heading"><div><h1>Tổng quan</h1><div class="sub">Theo dõi tình hình kinh doanh của cửa hàng.</div></div><button onclick="page='sales';document.getElementById('topTitle').textContent=titles.sales;render()">＋ Tạo đơn hàng</button></div>
<div class="cards"><div class="stat"><div class="label">Doanh thu ghi nhận</div><div class="value">${money(revenue)}</div><div class="trend">Tổng doanh thu cửa hàng</div></div><div class="stat"><div class="label">Đơn hàng hôm nay</div><div class="value">${todayOrders.length}</div><div class="trend">Ngày ${today}</div></div><div class="stat"><div class="label">Sản phẩm đang quản lý</div><div class="value">${products.length}</div><div class="trend">Mã hàng trong danh mục</div></div><div class="stat"><div class="label">Sắp hết hàng</div><div class="value">${products.filter(p=>p.stock<10).length}</div><div class="trend" style="color:#a66a00">Tồn kho dưới 10</div></div></div>
<div class="grid2"><div class="panel"><div class="panel-title"><h3>Hóa đơn gần đây</h3><button class="secondary" onclick="go('sales')">Xem tất cả</button></div>${orders.length?`<div class="table-wrap"><table><thead><tr><th>Mã hóa đơn</th><th>Khách hàng</th><th>Thành tiền</th><th>Trạng thái</th></tr></thead><tbody>${orders.slice(-5).reverse().map(o=>`<tr><td><strong>${o.id}</strong></td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td><span class="pill ${o.status==='Đã hủy'?'cancel':''}">${o.status}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Chưa có hóa đơn. Tạo đơn hàng đầu tiên để bắt đầu.</div>`}</div>
<div class="panel"><div class="panel-title"><h3>Thao tác nhanh</h3></div><div class="quick"><button onclick="go('sales')"><span>🧾</span>Bán hàng mới</button><button onclick="openProduct()"><span>📦</span>Thêm sản phẩm</button><button onclick="go('customers')"><span>👥</span>Quản lý khách hàng</button><button onclick="go('reports')"><span>📈</span>Xem báo cáo</button></div></div></div>`}
function go(p){page=p;document.getElementById('topTitle').textContent=titles[p];document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function productsPage(){return `<div class="heading"><div><h1>Sản phẩm</h1><div class="sub">Quản lý danh mục, giá bán và số lượng hàng.</div></div><button onclick="openProduct()">＋ Thêm sản phẩm</button></div><div class="panel"><div class="tools"><input id="productSearch" placeholder="Tìm tên sản phẩm hoặc mã SKU..." oninput="filterTable('productSearch','productRows')"><select id="categoryFilter" onchange="filterTable('productSearch','productRows')"><option value="">Tất cả danh mục</option><option>Đồ uống</option><option>Thức ăn</option><option>Khác</option></select></div><div class="table-wrap"><table><thead><tr><th>Mã SKU</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Đơn vị</th><th>Giá bán</th><th></th></tr></thead><tbody id="productRows">${products.map(p=>`<tr data-search="${esc((p.name+' '+p.sku).toLowerCase())}" data-cat="${esc(p.category)}"><td>${esc(p.sku)}</td><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>${esc(p.unit||'bịch')}</td><td>${money(p.price)}</td><td><button class="secondary" onclick="openProduct(${p.id})">Sửa</button> <button class="danger" onclick="deleteProduct(${p.id})">Xóa</button></td></tr>`).join('')}</tbody></table></div></div>`}
function inventoryPage(){return `<div class="heading"><div><h1>Tồn kho</h1><div class="sub">Theo dõi lượng hàng hiện có và cảnh báo sắp hết.</div></div><button onclick="adjustStock()">± Điều chỉnh tồn</button></div><div class="cards"><div class="stat"><div class="label">Tổng mã hàng</div><div class="value">${products.length}</div></div><div class="stat"><div class="label">Tổng số lượng tồn</div><div class="value">${products.reduce((a,p)=>a+p.stock,0)}</div></div><div class="stat"><div class="label">Sắp hết (dưới 10)</div><div class="value">${products.filter(p=>p.stock<10).length}</div></div><div class="stat"><div class="label">Giá trị tồn theo giá vốn</div><div class="value">${money(products.reduce((a,p)=>a+p.stock*p.cost,0))}</div></div></div><div class="panel"><div class="panel-title"><h3>Danh sách tồn kho</h3></div><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Sản phẩm</th><th>Danh mục</th><th>Tồn hiện tại</th><th>Trạng thái</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${p.stock}</td><td><span class="pill ${p.stock<10?'low':''}">${p.stock<10?'Sắp hết hàng':'Còn hàng'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function customersPage(){return `<div class="heading"><div><h1>Khách hàng</h1><div class="sub">Thông tin khách hàng và điểm tích lũy.</div></div><button onclick="openCustomer()">＋ Thêm khách hàng</button></div><div class="panel"><div class="tools"><input id="customerSearch" placeholder="Tìm theo tên hoặc số điện thoại..." oninput="filterTable('customerSearch','customerRows')"></div><div class="table-wrap"><table><thead><tr><th>Khách hàng</th><th>Số điện thoại</th><th>Điểm tích lũy</th><th>Số đơn mua</th><th>Thao tác</th></tr></thead><tbody id="customerRows">${customers.map(c=>`<tr data-search="${esc((c.name+' '+c.phone).toLowerCase())}"><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone||'—')}</td><td>${c.points||0}</td><td>${orders.filter(o=>o.customer===c.name&&o.status!=='Đã hủy').length}</td><td><button class="secondary" onclick="openCustomer(${c.id})">Sửa</button> <button class="danger" onclick="deleteCustomer(${c.id})">Xóa</button></td></tr>`).join('')}</tbody></table></div></div>`}
function salesPage(){return `<div class="heading"><div><h1>Bán hàng / Hóa đơn</h1><div class="sub">Tạo hóa đơn bán hàng, trừ tồn kho và xem lịch sử đơn.</div></div><button onclick="openSale()">＋ Tạo hóa đơn</button></div><div class="panel"><div class="tools"><button class="secondary" onclick="toggleAllOrders(true)">☑ Chọn tất cả</button><button class="secondary" onclick="toggleAllOrders(false)">Bỏ chọn</button><button class="danger" onclick="deleteSelectedOrders()">🗑 Xóa hóa đơn đã chọn</button><button class="secondary" onclick="exportSelectedOrdersImage()">🖼 Xuất ảnh đơn đã chọn</button><input id="orderSearch" placeholder="Tìm mã hóa đơn hoặc khách hàng..." oninput="filterTable('orderSearch','orderRows')"><select id="statusFilter" onchange="filterTable('orderSearch','orderRows')"><option value="">Tất cả trạng thái</option><option>Đã thanh toán</option><option>Đã hủy</option></select></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="Chọn tất cả" onchange="toggleAllOrders(this.checked)"></th><th>Mã hóa đơn</th><th>Ngày</th><th>Khách hàng</th><th>Số mặt hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="orderRows">${orders.length?orders.slice().reverse().map(o=>`<tr data-search="${esc((o.id+' '+o.customer).toLowerCase())}" data-status="${o.status}"><td><input type="checkbox" class="order-select" value="${esc(o.id)}" aria-label="Chọn ${esc(o.id)}"></td><td><strong>${o.id}</strong></td><td>${o.date}</td><td>${esc(o.customer)}</td><td>${o.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(o.total)}</td><td><span class="pill ${o.status==='Đã hủy'?'cancel':''}">${o.status}</span></td><td><button class="secondary" onclick="viewOrder('${o.id}')">Chi tiết</button> <button class="secondary" onclick="editOrder('${o.id}')">Sửa</button> ${o.status!=='Đã hủy'?`<button class="danger" onclick="cancelOrder('${o.id}')">Hủy</button>`:''} <button class="danger" onclick="deleteOrder('${o.id}')">Xóa</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty">Chưa có hóa đơn nào.</td></tr>`}</tbody></table></div></div>`}
function reportsPage(){let valid=orders.filter(o=>o.status!=='Đã hủy'),rev=valid.reduce((a,o)=>a+o.total,0),qty=valid.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty,0),0),top={};valid.forEach(o=>o.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));let max=Math.max(1,...Object.values(top));return `<div id="reportCapture"><div class="heading"><div><h1>Báo cáo</h1><div class="sub">Tổng hợp doanh thu và mặt hàng bán chạy của cửa hàng.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="captureReport()">📸 Chụp báo cáo từ đầu đến cuối</button><button class="secondary" onclick="exportCSV()">⇩ Xuất CSV hóa đơn</button></div></div><div class="cards"><div class="stat"><div class="label">Tổng doanh thu</div><div class="value">${money(rev)}</div></div><div class="stat"><div class="label">Hóa đơn hợp lệ</div><div class="value">${valid.length}</div></div><div class="stat"><div class="label">Sản phẩm đã bán</div><div class="value">${qty}</div></div><div class="stat"><div class="label">Giá trị tồn kho</div><div class="value">${money(products.reduce((a,p)=>a+p.stock*p.cost,0))}</div></div></div><div class="panel"><div class="panel-title"><h3>Sản phẩm bán chạy</h3></div>${Object.keys(top).length?Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,q])=>`<div class="barrow"><span>${esc(n)}</span><div class="bar"><i style="width:${q/max*100}%"></i></div><strong>${q} sản phẩm</strong></div>`).join(''):'<div class="empty">Chưa có dữ liệu bán hàng. Tạo hóa đơn để xem báo cáo.</div>'}</div></div>`}
function employeesPage(){let html=`<div class="heading"><div><h1>Quản lý tài khoản nhân viên</h1><div class="sub">Tạo tài khoản, cấp mật khẩu lần đầu, đổi mật khẩu và xóa tài khoản nhân viên.</div></div></div><div class="panel"><div class="panel-title"><h3>👥 Danh sách tài khoản nhân viên</h3><span class="pill low">Bản thiết bị</span></div><p class="muted">Lưu ý: tài khoản phiên bản này được lưu trên trình duyệt hiện tại, chưa xác thực an toàn hoặc đồng bộ giữa nhiều thiết bị. Cần cấu hình Firebase Authentication và quy tắc phân quyền trước khi dùng chính thức.</p><div class="tools"><input id="empUser" placeholder="Tên đăng nhập nhân viên"><input id="empName" placeholder="Họ tên nhân viên"><input id="empPass" type="password" placeholder="Mật khẩu cấp lần đầu"><button onclick="createEmployee()">＋ Tạo tài khoản</button></div><div class="table-wrap"><table style="min-width:500px"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="employeeRows"></tbody></table></div></div>`;setTimeout(()=>renderEmployees(),0);return html} function settingsPage(){return `<div class="heading"><div><h1>Cài đặt</h1><div class="sub">Thiết lập thông tin cửa hàng.</div></div></div><div class="panel"><div class="panel-title"><h3>Thông tin cửa hàng</h3></div><div class="fields"><div class="field"><label>Tên cửa hàng</label><input id="shopName" value="${esc(localStorage.getItem('shop_shopname')||'Cửa hàng của tôi')}"></div><div class="field"><label>Số điện thoại</label><input id="shopPhone" placeholder="Nhập số điện thoại"></div><div class="field"><label>Địa chỉ</label><input id="shopAddress" placeholder="Địa chỉ cửa hàng"></div><div class="field"><label>Tiền tệ</label><select><option>VND — Việt Nam đồng</option></select></div></div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="saveSettings()">Lưu cài đặt</button><button class="ghost" onclick="exportCSV()">Xuất dữ liệu hóa đơn CSV</button><button class="danger" onclick="resetData()">Xóa dữ liệu cửa hàng</button></div></div><div class="panel"><div class="panel-title"><h3>Google Sheets — lưu dữ liệu cửa hàng</h3></div><p class="muted">Dán URL Web App của Google Apps Script để tự gửi sản phẩm, khách hàng và hóa đơn lên bảng tính.</p><div class="field"><label>URL Apps Script</label><input id="sheetsUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(localStorage.getItem('shop_sheets_url')||'')}"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button onclick="saveSheetsUrl()">Lưu URL Google Sheets</button><button class="secondary" onclick="syncSheetsNow()">Gửi dữ liệu ngay</button></div><p id="sheetsMessage" class="muted"></p></div><div class="panel"><div class="panel-title"><h3>👥 Quản lý tài khoản nhân viên</h3><span class="pill low">Bản thiết bị</span></div><p class="muted">Tạo tài khoản, cấp mật khẩu ban đầu, đổi hoặc xóa tài khoản. Trạng thái online được ước lượng trên trình duyệt này; để bảo mật đa thiết bị cần bật Firebase Authentication và phân quyền máy chủ.</p><div class="tools"><input id="empUser" placeholder="Tên đăng nhập nhân viên"><input id="empName" placeholder="Họ tên nhân viên"><input id="empPass" type="password" placeholder="Mật khẩu cấp lần đầu"><button onclick="createEmployee()">＋ Tạo tài khoản</button></div><div class="table-wrap"><table style="min-width:500px"><thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="employeeRows"></tbody></table></div><p class="muted">Tài khoản quản lý mặc định cho giao diện: <strong>admin</strong>; lần đầu cần tự đặt mật khẩu trong phần quản lý tài khoản trước khi triển khai chính thức.</p></div><div class="panel"><div class="panel-title"><h3>Tài khoản Google & đồng bộ nhiều thiết bị</h3><span id="cloudStatus" class="pill low">Chưa kết nối</span></div>
<p class="muted">Nhập cấu hình Firebase của dự án do anh sở hữu để bật Google Sign-In và đồng bộ dữ liệu qua các thiết bị. Không nhập mật khẩu Google vào ứng dụng.</p>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button onclick="saveFirebaseConfig()">Lưu cấu hình</button><button class="secondary" onclick="googleSignIn()">Đăng nhập Google</button><button class="ghost" onclick="cloudSyncNow()">Đồng bộ ngay</button><button class="ghost" onclick="googleSignOut()">Đăng xuất</button></div>

function filterTable(inputId,tbodyId){let q=(document.getElementById(inputId)?.value||'').toLowerCase(),cat=document.getElementById('categoryFilter')?.value||'',status=document.getElementById('statusFilter')?.value||'';document.querySelectorAll('#'+tbodyId+' tr').forEach(r=>{r.style.display=((r.dataset.search||'').includes(q)&&(!cat||r.dataset.cat===cat)&&(!status||r.dataset.status===status))?'':'none'})}
function openModal(content){document.getElementById('modalbody').innerHTML=content;document.getElementById('modalback').style.display='flex'}
function closeModal(){document.getElementById('modalback').style.display='none'}
function openProduct(id){let p=products.find(x=>x.id===id)||{name:'',sku:'',price:'',cost:'',stock:0,category:'Khác',unit:'bịch'};openModal(`<h2>${id?'Sửa sản phẩm':'Thêm sản phẩm'}</h2><form onsubmit="saveProduct(event,${id||'null'})"><div class="fields"><div class="field full"><label>Tên sản phẩm *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Mã SKU *</label><input name="sku" required value="${esc(p.sku)}"></div><div class="field"><label>Danh mục</label><select name="category"><option ${p.category==='Đồ uống'?'selected':''}>Đồ uống</option><option ${p.category==='Thức ăn'?'selected':''}>Thức ăn</option><option ${p.category==='Khác'?'selected':''}>Khác</option></select></div><div class="field"><label>Đơn vị bán</label><select name="unit"><option value="bịch" ${(p.unit||'bịch')==='bịch'?'selected':''}>Bịch</option><option value="xâu" ${p.unit==='xâu'?'selected':''}>Xâu</option></select></div><div class="field"><label>Giá bán (₫) *</label><input name="price" type="number" min="0" required value="${p.price}"></div><div class="field"><label>Giá vốn (₫)</label><input name="cost" type="number" min="0" value="${p.cost}"></div></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Đóng</button><button>Lưu sản phẩm</button></div></form>`)}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(!p)return;if(orders.some(o=>o.status!=='Đã hủy'&&o.items.some(i=>i.id===id))){if(!confirm('Sản phẩm này đã có trong hóa đơn. Xóa khỏi danh mục sẽ giữ nguyên lịch sử hóa đơn. Tiếp tục?'))return}else if(!confirm('Xóa sản phẩm '+p.name+'?'))return;products=products.filter(x=>x.id!==id);save();render();toast('Đã xóa sản phẩm khỏi danh mục')}
function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),p={id:id||Date.now(),name:f.get('name').trim(),sku:f.get('sku').trim(),category:f.get('category'),unit:f.get('unit')||'bịch',price:+f.get('price'),cost:+f.get('cost')};if(products.some(x=>x.sku.toLowerCase()===p.sku.toLowerCase()&&x.id!==p.id)){toast('Mã SKU đã tồn tại');return}if(id)products=products.map(x=>x.id===id?p:x);else products.push(p);save();closeModal();render();toast('Đã lưu sản phẩm')}
function openCustomer(id){let c=customers.find(x=>x.id===id)||{name:'',phone:'',points:0};openModal(`<h2>${id?'Sửa khách hàng':'Thêm khách hàng'}</h2><form onsubmit="saveCustomer(event,${id||'null'})"><div class="fields"><div class="field full"><label>Họ tên *</label><input name="name" required value="${esc(c.name)}"></div><div class="field full"><label>Số điện thoại</label><input name="phone" inputmode="tel" value="${esc(c.phone||'')}"></div></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Đóng</button><button>Lưu khách hàng</button></div></form>`)}
function saveCustomer(e,id){e.preventDefault();let f=new FormData(e.target),c={id:id||Date.now(),name:f.get('name').trim(),phone:f.get('phone').trim(),points:id?(customers.find(x=>x.id===id)?.points||0):0};if(customers.some(x=>x.phone&&c.phone&&x.phone===c.phone&&x.id!==c.id)){toast('Số điện thoại đã tồn tại');return}if(id)customers=customers.map(x=>x.id===id?c:x);else customers.push(c);save();closeModal();render();toast(id?'Đã cập nhật khách hàng':'Đã thêm khách hàng')}
function deleteCustomer(id){let c=customers.find(x=>x.id===id);if(!c)return;if(c.name==='Khách lẻ'&&customers.length===1){toast('Không thể xóa khách hàng mặc định');return}if(orders.some(o=>o.customer===c.name)){if(!confirm('Khách hàng đã có hóa đơn. Xóa khỏi danh sách nhưng giữ nguyên lịch sử hóa đơn?'))return}else if(!confirm('Xóa khách hàng '+c.name+'?'))return;customers=customers.filter(x=>x.id!==id);save();render();toast('Đã xóa khách hàng')}
function openSale(){let rows=products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.unit||'bịch')} · ${money(p.price)}</option>`).join('');openModal(`<h2>01 · Lập hóa đơn</h2><div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:14px;margin-bottom:16px"><strong>📷 Quét đơn hàng bằng hình ảnh</strong><p class="muted" style="margin:6px 0 12px">Có thể quét mã vạch sản phẩm bằng camera để thêm nhanh vào hóa đơn.</p><button type="button" class="secondary" onclick="scanBarcode()">📷 Quét mã vạch</button><div id="scanStatus" class="muted" style="margin-top:8px"></div></div><form onsubmit="saveSale(event)"><div class="fields"><div class="field full"><label>Tên khách hàng</label><input name="customer" placeholder="Nhập tên khách hàng" autocomplete="off"></div><div class="field full"><label>Tìm kiếm sản phẩm nhanh</label><input id="saleSearch" placeholder="Gõ tên hoặc mã sản phẩm để tìm" oninput="filterSaleProducts()"></div><div class="field full"><label>Chọn sản phẩm</label><select id="saleProduct" required><option value="">-- Chọn sản phẩm --</option>${rows}</select></div><div class="field"><label>Số lượng</label><input id="saleQty" type="number" min="1" value="1" required></div><div class="field"><label>Đơn giá (₫)</label><input id="salePrice" type="number" min="0" value="0" required></div><div class="field full"><label>Ghi chú</label><input name="note" placeholder="Ghi chú hóa đơn (không bắt buộc)"></div></div><button type="button" class="secondary" style="margin-top:14px" onclick="addSaleLine()">＋ Thêm vào hóa đơn</button><div class="table-wrap" style="margin-top:14px"><table style="min-width:450px"><thead><tr><th>Sản phẩm</th><th>SL (đơn vị)</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead><tbody id="saleLines"><tr><td colspan="5" class="empty">Chưa có sản phẩm trong hóa đơn</td></tr></tbody></table></div><div style="display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line);margin-top:12px"><span>Tổng hóa đơn</span><strong id="saleTotal" style="font-size:22px;color:#6b3fc4">0 ₫</strong></div><div class="fields"><button type="submit">Lưu hóa đơn</button><button type="button" class="secondary" onclick="openSale()">Làm mới</button><button type="button" class="ghost field full" onclick="saveReceiptImage()">Lưu ảnh hóa đơn</button></div><p class="muted" style="font-size:12px;margin-top:10px">Tên khách hàng được nhập tự do. Hóa đơn, sản phẩm và khách hàng sẽ được gửi lên Google Sheets khi anh cấu hình URL Apps Script trong Cài đặt.</p></form>`);window.saleDraft=[];document.getElementById('saleProduct').addEventListener('change',e=>{let p=products.find(x=>x.id===+e.target.value);document.getElementById('salePrice').value=p?p.price:0})}
function filterSaleProducts(){let q=document.getElementById('saleSearch').value.toLowerCase();[...document.getElementById('saleProduct').options].forEach((o,i)=>{if(!i)return;let p=products.find(p=>p.id===+o.value);o.hidden=!!q&&!((p.name+' '+p.sku).toLowerCase().includes(q))})}
function addSaleLine(){let id=+document.getElementById('saleProduct').value,p=products.find(x=>x.id===id),qty=+document.getElementById('saleQty').value,price=+document.getElementById('salePrice').value;if(!p||qty<1||!Number.isFinite(price)){toast('Chọn sản phẩm, số lượng và đơn giá hợp lệ');return}let existing=window.saleDraft.find(x=>x.id===id&&x.price===price);if(existing)existing.qty+=qty;else window.saleDraft.push({id:p.id,name:p.name,sku:p.sku,unit:p.unit||'bịch',price,qty});renderSaleDraft()}
function renderSaleDraft(){let body=document.getElementById('saleLines');if(!body)return;body.innerHTML=window.saleDraft.length?window.saleDraft.map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${i.qty} ${esc(i.unit)}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td><td><button type="button" class="danger" onclick="removeSaleLine(${n})">Xóa</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Chưa có sản phẩm trong hóa đơn</td></tr>';document.getElementById('saleTotal').textContent=money(window.saleDraft.reduce((a,i)=>a+i.qty*i.price,0))}
function removeSaleLine(n){window.saleDraft.splice(n,1);renderSaleDraft()}
function saveReceiptImage(){toast('Anh có thể chọn In hóa đơn rồi chọn Lưu PDF trên điện thoại')}
function saveSale(e){e.preventDefault();let draft=window.saleDraft||[];if(!draft.length){toast('Thêm ít nhất một sản phẩm vào hóa đơn');return}for(let i of draft){let p=products.find(p=>p.id===i.id);if(!p){toast('Sản phẩm không còn trong danh mục: '+i.name);return}}let items=draft.map(i=>({...i,subtotal:i.qty*i.price})),total=items.reduce((a,i)=>a+i.subtotal,0),f=new FormData(e.target),customer=String(f.get('customer')||'').trim()||'Khách lẻ',id='HD'+Date.now().toString().slice(-8);orders.push({id,date:new Date().toLocaleDateString('vi-VN'),customer,note:f.get('note'),items,total,status:'Đã thanh toán'});save();closeModal();go('sales');toast('Đã lưu hóa đơn'+(getSheetsUrl()?' — đang gửi dữ liệu lên Google Sheets':''))}

function createEmployee(){let username=document.getElementById('empUser').value.trim(),name=document.getElementById('empName').value.trim(),pass=document.getElementById('empPass').value;if(!username||!name||pass.length<6){toast('Nhập tài khoản, họ tên và mật khẩu ít nhất 6 ký tự');return}let users=getEmployees();if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){toast('Tên đăng nhập đã tồn tại');return}users.push({username,name,password:pass,online:false,createdAt:new Date().toISOString()});localStorage.setItem('shop_employees',JSON.stringify(users));['empUser','empName','empPass'].forEach(id=>document.getElementById(id).value='');renderEmployees();toast('Đã tạo tài khoản nhân viên trên thiết bị này')}

let scanStream=null,scanActive=false;
async function scanBarcode(){let status=document.getElementById('scanStatus');if(!('BarcodeDetector' in window)){status.textContent='Trình duyệt này chưa hỗ trợ quét mã vạch. Có thể nhập SKU thủ công.';return}try{let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});let video=document.createElement('video');video.setAttribute('playsinline','');video.style.cssText='width:100%;max-height:240px;border-radius:10px;background:#111';let box=document.createElement('div');box.id='scannerBox';box.append(video);let stop=document.createElement('button');stop.type='button';stop.className='danger';stop.textContent='Dừng camera';stop.onclick=()=>{scanActive=false;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());box.remove();status.textContent='Đã dừng camera'};box.append(stop);status.after(box);status.textContent='Đưa mã vạch vào khung hình';scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=scanStream;await video.play();scanActive=true;let loop=async()=>{if(!scanActive)return;try{let codes=await detector.detect(video);if(codes.length){let code=codes[0].rawValue;scanActive=false;scanStream.getTracks().forEach(t=>t.stop());box.remove();let p=products.find(p=>p.sku.toLowerCase()===code.toLowerCase());status.textContent=p?'Đã nhận mã '+code+' — '+p.name+'; nhập số lượng bên dưới.':'Đã quét '+code+' nhưng chưa có SKU trùng khớp. Hãy đặt SKU sản phẩm bằng mã vạch này.';if(p){let q=document.querySelector('[data-qty="'+p.id+'"]');if(q)q.value=String(Math.min(p.stock,(+q.value||0)+1))}else toast('Chưa có sản phẩm mang mã '+code);return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){status.textContent='Không mở được camera. Hãy cấp quyền camera và dùng HTTPS.';if(scanStream)scanStream.getTracks().forEach(t=>t.stop())}}

async function getFirebase(){let c=firebaseConfig();if(!c.apiKey)throw Error('Vào Cài đặt và lưu cấu hình Firebase trước.');let appmod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');let authmod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');let dbmod=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');let app=appmod.getApps().length?appmod.getApp():appmod.initializeApp({apiKey:c.apiKey,authDomain:c.authDomain,projectId:c.projectId,appId:c.appId});return {c,auth:authmod.getAuth(app),GoogleAuthProvider:authmod.GoogleAuthProvider,signInWithPopup:authmod.signInWithPopup,signOut:authmod.signOut,db:dbmod.getFirestore(app),doc:dbmod.doc,setDoc:dbmod.setDoc,getDoc:dbmod.getDoc,onSnapshot:dbmod.onSnapshot}}
async function googleSignIn(){try{let f=await getFirebase(),result=await f.signInWithPopup(f.auth,new f.GoogleAuthProvider());window.__cloudUser=result.user;if(result.user.email!=='loi0933451652@gmail.com')throw Error('Tài khoản này chưa được cấp quyền quản lý. Hãy đăng nhập bằng email quản lý đã cấu hình.');startFirestoreRealtime(f);let m=document.getElementById('cloudMessage');if(m)m.textContent='Đã đăng nhập: '+result.user.email+' — đang kết nối đồng bộ thời gian thực.';let s=document.getElementById('cloudStatus');if(s){s.textContent='Đang kết nối realtime';s.className='pill'}toast('Đăng nhập thành công, đang kết nối đồng bộ')}catch(e){let m=document.getElementById('cloudMessage');if(m)m.textContent='Chưa đăng nhập/kết nối được: '+(e.message||e);toast('Kiểm tra email quản lý, Firebase Auth và tên miền')}}
function startFirestoreRealtime(f){if(cloudUnsubscribe)cloudUnsubscribe();cloudReady=false;let ref=f.doc(f.db,'shops',f.c.shopId,'data','main');cloudUnsubscribe=f.onSnapshot(ref,async snap=>{if(!window.__cloudUser||window.__cloudUser.email!=='loi0933451652@gmail.com')return;if(!snap.exists()){try{await f.setDoc(ref,{products,customers,orders,shopName:localStorage.getItem('shop_shopname')||'Cửa hàng của tôi',updatedAt:new Date().toISOString(),updatedBy:f.auth.currentUser.uid});cloudReady=true}catch(e){setCloudMessage('Chưa tạo được dữ liệu cloud: '+e.message)}return}let d=snap.data();if(d.updatedBy===f.auth.currentUser.uid&&cloudApplying)return;cloudApplying=true;try{if(Array.isArray(d.products))products=d.products;if(Array.isArray(d.customers))customers=d.customers;if(Array.isArray(d.orders))orders=d.orders;if(d.shopName)localStorage.setItem('shop_shopname',d.shopName);localStorage.setItem('shop_products',JSON.stringify(products));localStorage.setItem('shop_customers',JSON.stringify(customers));localStorage.setItem('shop_orders',JSON.stringify(orders));cloudReady=true;render();setCloudMessage('Đã đồng bộ thời gian thực · '+new Date().toLocaleTimeString('vi-VN'));let st=document.getElementById('cloudStatus');if(st){st.textContent='Realtime đang hoạt động';st.className='pill'}}finally{setTimeout(()=>{cloudApplying=false},0)}},err=>{cloudReady=false;setCloudMessage('Lỗi đồng bộ Firestore: '+err.message)});}
function setCloudMessage(s){let m=document.getElementById('cloudMessage');if(m)m.textContent=s}
async function syncFirestoreBackground(){if(cloudApplying||!cloudReady||!window.__cloudUser||window.__cloudUser.email!=='loi0933451652@gmail.com')return;clearTimeout(cloudWriteTimer);cloudWriteTimer=setTimeout(async()=>{try{let f=await getFirebase();if(!f.auth.currentUser||f.auth.currentUser.email!=='loi0933451652@gmail.com')return;await f.setDoc(f.doc(f.db,'shops',f.c.shopId,'data','main'),{products,customers,orders,shopName:localStorage.getItem('shop_shopname')||'Cửa hàng của tôi',updatedAt:new Date().toISOString(),updatedBy:f.auth.currentUser.uid});setCloudMessage('Đã lưu lên Firebase · '+new Date().toLocaleTimeString('vi-VN'))}catch(e){setCloudMessage('Không thể đồng bộ Firebase: '+e.message)}},350)}
async function googleSignOut(){try{let f=await getFirebase();if(cloudUnsubscribe)cloudUnsubscribe();cloudUnsubscribe=null;cloudReady=false;await f.signOut(f.auth);window.__cloudUser=null;toast('Đã đăng xuất Google');let s=document.getElementById('cloudStatus');if(s){s.textContent='Đã đăng xuất';s.className='pill low'}}catch(e){toast(e.message||'Không thể đăng xuất')}}
async function cloudSyncNow(){try{let f=await getFirebase();if(!f.auth.currentUser)throw Error('Hãy đăng nhập Google trước.');let ref=f.doc(f.db,'shops',f.c.shopId,'data','main');let snapshot=await f.getDoc(ref);if(snapshot.exists()){if(!confirm('Đã có dữ liệu trên đám mây. Nhấn OK để tải dữ liệu đám mây về thiết bị; nhấn Cancel để tải dữ liệu thiết bị lên đám mây.')){await f.setDoc(ref,{products,customers,orders,shopName:localStorage.getItem('shop_shopname')||'Cửa hàng của tôi',updatedAt:new Date().toISOString(),updatedBy:f.auth.currentUser.uid});cloudReady=true;startFirestoreRealtime(f);toast('Đã tải dữ liệu thiết bị lên đám mây')}else{let d=snapshot.data();if(Array.isArray(d.products)&&Array.isArray(d.customers)&&Array.isArray(d.orders)){products=d.products;customers=d.customers;orders=d.orders;localStorage.setItem('shop_shopname',d.shopName||'Cửa hàng của tôi');save();render();cloudReady=true;startFirestoreRealtime(f);toast('Đã tải dữ liệu đám mây về thiết bị')}}}else{await f.setDoc(ref,{products,customers,orders,shopName:localStorage.getItem('shop_shopname')||'Cửa hàng của tôi',updatedAt:new Date().toISOString(),updatedBy:f.auth.currentUser.uid});cloudReady=true;startFirestoreRealtime(f);toast('Đã tạo bản dữ liệu đám mây và bật realtime')}}catch(e){let m=document.getElementById('cloudMessage');if(m)m.textContent='Đồng bộ chưa thành công: '+(e.message||e);toast('Đồng bộ lỗi — xem hướng dẫn trong README')}}

render();
</script></body></html>
